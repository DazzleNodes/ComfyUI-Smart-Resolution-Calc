[project]
name = "comfyui-smart-resolution-calc"
description = "Flexible resolution and latent generation for ComfyUI with toggle-based dimension inputs and automatic calculation of missing values"
version = "0.12.7"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# No pip dependencies - all dependencies provided by ComfyUI
dependencies = []

# Optional development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Repository = "https://github.com/DazzleNodes/ComfyUI-Smart-Resolution-Calc"
Issues = "https://github.com/DazzleNodes/ComfyUI-Smart-Resolution-Calc/issues"
Changelog = "https://github.com/DazzleNodes/ComfyUI-Smart-Resolution-Calc/releases"
Documentation = "https://github.com/DazzleNodes/ComfyUI-Smart-Resolution-Calc#readme"

# ComfyUI Registry Configuration
# See: https://docs.comfy.org/registry/publishing
[tool.comfy]
PublisherId = "djdarcy"
DisplayName = "Smart Resolution Calculator"
Icon = ""

# Publishing: update the version here, push, then publish a GitHub release
# tagged v<version>; GitHub Actions publishes that release to the ComfyUI Registry

# Version tooling (scripts/repokit-common/sync-versions.py, run by the git hooks).
# This node keeps its version file at the repository root, not in a package folder.
[tool.repokit-common]
version-source = "version.py"
changelog = "CHANGELOG.md"
repo-url = "https://github.com/DazzleNodes/ComfyUI-Smart-Resolution-Calc"
tag-prefix = "v"
tag-format = "human"
# The tests are scripts with their own runners, not a pytest suite; pre-push
# runs this from the repository root and treats a non-zero exit as failing.
test-command = "python tests/test_dimension_source_calculator.py && python tests/test_calculation_pipeline.py"
